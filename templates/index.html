<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mana AI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:#faf7f2;
            color:#2d2d2d;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{
            width:100%;
            max-width:850px;
            background:white;
            border-radius:18px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

        .header{
            text-align:center;
            margin-bottom:25px;
        }

        .header h1{
            color:#ff9933;
            font-size:2rem;
        }

        .header p{
            color:#666;
            margin-top:8px;
        }

        .feature-select{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:10px;
            margin-bottom:15px;
            font-size:15px;
        }

        textarea{
            width:100%;
            min-height:140px;
            resize:vertical;
            border:1px solid #ddd;
            border-radius:10px;
            padding:15px;
            font-size:15px;
            outline:none;
        }

        textarea:focus{
            border-color:#138808;
        }

        button{
            width:100%;
            margin-top:15px;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#138808;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.2s;
        }

        button:hover{
            opacity:.9;
        }

        .loader{
            display:none;
            text-align:center;
            margin-top:20px;
            color:#ff9933;
            font-weight:600;
        }

        .history{
            margin-top:30px;
        }

        .bubble{
            padding:15px;
            border-radius:12px;
            margin-bottom:15px;
        }

        .user{
            background:#fff5e8;
            border-left:5px solid #ff9933;
        }

        .ai{
            background:#f1fff0;
            border-left:5px solid #138808;
        }

        .error{
            background:#ffecec;
            border-left:5px solid #d9534f;
        }

        h3{
            margin-bottom:6px;
        }

        ul{
            padding-left:20px;
        }

        pre{
            overflow-x:auto;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Mana AI</h1>
        <p>Local AI Assistant powered by DeepSeek-R1 (Ollama)</p>
    </div>

    <select id="feature" class="feature-select">
        <option value="explain">Explain a Concept</option>
        <option value="summarize">Summarize Text</option>
        <option value="rewrite">Rewrite Professionally</option>
        <option value="bullet_points">Convert to Bullet Points</option>
        <option value="translate">Translate Text</option>
    </select>

    <textarea
        id="userInput"
        placeholder="Enter your text here..."
    ></textarea>

    <button onclick="generateResponse()">
        Generate Response
    </button>

    <div class="loader" id="loader">
        Generating response...
    </div>

    <div id="chatHistory" class="history"></div>

</div>

<script>

async function generateResponse() {

    const text = document.getElementById("userInput").value.trim();
    const feature = document.getElementById("feature").value;

    const history = document.getElementById("chatHistory");
    const loader = document.getElementById("loader");

    if (!text) {
        alert("Please enter some text.");
        return;
    }

    loader.style.display = "block";

    history.innerHTML =
    `
    <div class="bubble user">
        <h3>You</h3>
        <p>${text}</p>
    </div>
    ` + history.innerHTML;

    try {

        const response = await fetch("/api/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text,
                feature
            })
        });

        const data = await response.json();

        if (data.error) {
            throw new Error(data.error);
        }

        history.innerHTML =
        `
        <div class="bubble ai">
            <h3>Mana AI</h3>
            ${marked.parse(data.response)}
        </div>
        ` + history.innerHTML;

    } catch (error) {

        history.innerHTML =
        `
        <div class="bubble error">
            <h3>Error</h3>
            <p>${error.message}</p>
        </div>
        ` + history.innerHTML;
    }

    loader.style.display = "none";
    document.getElementById("userInput").value = "";
}

</script>

</body>
</html>
